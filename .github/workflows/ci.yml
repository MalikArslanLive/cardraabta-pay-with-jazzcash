name: Plugin checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    name: PHP ${{ matrix.php }} / WP ${{ matrix.wp }} / ${{ matrix.db }} / HPOS ${{ matrix.hpos }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        wp: ['7.1.4']
        wc: ['11.2.2']
        db: ['mariadb:11.4']
        hpos: ['yes', 'no']
        include:
          - php: '8.1'
            wp: '6.5'
            wc: '8.3.0'
            db: 'mariadb:11.4'
            hpos: 'no'
          - php: '8.3'
            wp: '7.1.4'
            wc: '11.2.2'
            db: 'mysql:8.4'
            hpos: 'yes'
    services:
      database:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot || mariadb-admin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, openssl
          coverage: none
          tools: wp-cli
          ini-values: memory_limit=512M
      - name: PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Install disposable WordPress and WooCommerce
        env:
          WP_VERSION: ${{ matrix.wp }}
          WC_VERSION: ${{ matrix.wc }}
          HPOS: ${{ matrix.hpos }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wordpress"
          cd "$RUNNER_TEMP/wordpress"
          wp core download --version="$WP_VERSION"
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306
          wp core install --url=http://localhost:8080 --title=Tests --admin_user=crjtest --admin_password=local-test-only-password --admin_email=test@example.org --skip-email
          wp plugin install woocommerce --version="$WC_VERSION" --activate
          ln -s "$GITHUB_WORKSPACE" wp-content/plugins/cardraabta-pay-with-jazzcash
          wp plugin activate cardraabta-pay-with-jazzcash
          wp option update woocommerce_custom_orders_table_enabled "$HPOS"
      - name: Payment security and real database regression tests
        env:
          CRJ_TESTING: '1'
        run: |
          set -euo pipefail
          WP_PATH="$RUNNER_TEMP/wordpress" bash scripts/test-wordpress.sh | tee integration.txt
      - name: HTTP and browser checks
        if: matrix.php == '8.3' && matrix.db == 'mariadb:11.4' && matrix.hpos == 'no'
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8080 -t "$RUNNER_TEMP/wordpress" > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://localhost:8080/wp-login.php > /dev/null; then break; fi
            sleep 1
          done
          python3 tests/http-smoke.py | tee http-smoke.txt
          npm install --prefix "$RUNNER_TEMP/browser" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/browser/node_modules" node tests/browser.cjs | tee browser-smoke.txt
      - name: Build distributable ZIP
        run: python3 scripts/build-release.py dist
      - name: WordPress Plugin Check on packaged files
        if: matrix.php == '8.3' && matrix.db == 'mariadb:11.4' && matrix.hpos == 'no'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/wordpress"
          wp plugin install plugin-check --version=2.2.0 --activate
          unzip "$GITHUB_WORKSPACE/dist/cardraabta-pay-with-jazzcash-1.0.0.zip" -d "$RUNNER_TEMP/package"
          wp plugin check "$RUNNER_TEMP/package/cardraabta-pay-with-jazzcash" --slug=cardraabta-pay-with-jazzcash --format=json | tee "$GITHUB_WORKSPACE/plugin-check.txt"
          python3 "$GITHUB_WORKSPACE/scripts/check-plugin-report.py" "$GITHUB_WORKSPACE/plugin-check.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results-php${{ matrix.php }}-wp${{ matrix.wp }}-${{ strategy.job-index }}
          path: |
            integration.txt
            plugin-check.txt
            http-smoke.txt
            browser-smoke.txt
            server.log
            dist/*
  platform-lint:
    name: Syntax on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          coverage: none
      - name: PHP and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l cardraabta-pay-with-jazzcash.php
          php -l includes/security.php
          node --check blocks.js
          node --check assets/admin.js
          node --check assets/settings.js
