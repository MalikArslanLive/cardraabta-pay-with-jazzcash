fastcgi_cache_path /var/cache/nginx/wordpress levels=1:2 keys_zone=WORDPRESS:10m inactive=10m;
map $request_method $skip_method { default 1; GET 0; HEAD 0; }
map $args $skip_args { default 1; '' 0; }
map $request_uri $skip_route {
    default 0;
    ~*(/wp-admin|/wp-login\.php|/cart|/checkout|/my-account|/wc-api|/jazzcash_ipn_v2) 1;
}
map $http_cookie $skip_cookie {
    default 0;
    ~*(wordpress_logged_in|woocommerce_items_in_cart|wp_woocommerce_session) 1;
}
server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php;
    location / { try_files $uri $uri/ /index.php?$args; }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass crj-fpm:9000;
        fastcgi_cache WORDPRESS;
        fastcgi_cache_key "$scheme$request_method$host$request_uri";
        fastcgi_cache_valid 200 1m;
        fastcgi_cache_bypass $skip_method $skip_args $skip_route $skip_cookie;
        fastcgi_no_cache $skip_method $skip_args $skip_route $skip_cookie;
        add_header X-CRJ-Cache $upstream_cache_status always;
    }
    location ~ /\. { deny all; }
}
