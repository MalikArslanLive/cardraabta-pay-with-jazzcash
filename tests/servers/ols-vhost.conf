docRoot /var/www/vhosts/localhost/html/
enableGzip 1
index {
    useServer 0
    indexFiles index.php
    autoIndex 0
}
rewrite {
    enable 1
    autoLoadHtaccess 1
    rules <<<END_rules
RewriteCond %{REQUEST_FILENAME} !-f
RewriteCond %{REQUEST_FILENAME} !-d
RewriteRule ^(.*)$ /index.php [L]
END_rules
}
